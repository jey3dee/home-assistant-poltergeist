name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      # Opens or updates the release pull request; merging it tags the commit and publishes
      # the GitHub release. A tag or release made with GITHUB_TOKEN starts no other
      # workflow, so anything that must follow a release goes here, gated on the
      # release_created output.
      # Reads release-please-config.json and .release-please-manifest.json by default.
      - uses: googleapis/release-please-action@v5
