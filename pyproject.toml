[project]
name = "poltergeist"
version = "0.1.0"
description = "Probabilistic presence tracking for Home Assistant"
requires-python = ">=3.14"
dependencies = []

[dependency-groups]
dev = ["pytest-homeassistant-custom-component", "ruff", "home-assistant-frontend==20260930.5"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
